<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSU Canteen - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="margin-top: 10vh;">
    <img src="psu-logo.png" alt="PSU Logo" class="logo">
    <h2>🍽 PSU Canteen</h2>

    <form onsubmit="login(); return false;">
        <input type="text" id="user" placeholder="Username / Student ID" required>
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit" id="loginBtn">Login to Canteen</button>
    </form>

    <p id="errorMsg" class="error hidden"></p>
    
    <div class="forgot">
        <p><a href="register.html">Create a Student Account 📝</a></p>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
