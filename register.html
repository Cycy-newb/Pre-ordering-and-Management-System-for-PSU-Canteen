<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PSU Canteen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="margin-top: 10vh;">
    <img src="psu-logo.png" alt="PSU Logo" class="logo">
    <h2>📝 Student Registration</h2>

    <form onsubmit="registerUser(); return false;">
        <input type="text" id="regUser" placeholder="Choose Student ID / Username" required>
        <input type="password" id="regPass" placeholder="Choose Secure Password" required>
        <button type="submit" style="background: linear-gradient(135deg, #4caf50, #45a049); box-shadow: 0 4px 6px rgba(76,175,80,0.2);">Create Account</button>
    </form>

    <div class="forgot">
        <p><a href="index.html">Already have an account? Login here</a></p>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
